<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>BunkSafe</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BunkSafe">
<meta name="theme-color" content="#101317">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --c-steel:#4C6FA6; --c-steel-soft:#4C6FA61a;
    --c-moss:#3F9468; --c-moss-soft:#3F94681a;
    --c-amber:#D98E2B; --c-amber-soft:#D98E2B1a;
    --c-rust:#B3563C; --c-rust-soft:#B3563C1a;
    --tile-bg:#14171D; --tile-fg:#F4F1E8; --tile-seam:#00000055;
    --radius-lg:18px; --radius-md:12px;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
    --font-sans:'Manrope', system-ui, sans-serif;
  }
  [data-theme="light"]{
    --bg-0:#E7ECEA; --bg-1:#EFF3F1; --surface:#FFFFFF; --surface-2:#F4F6F5;
    --text:#161A1A; --text-dim:#5C6663; --text-faint:#96A19D; --border:#DCE3E0;
    --shadow:0 10px 30px -12px rgba(20,30,28,0.18);
  }
  [data-theme="dark"]{
    --bg-0:#0B0D10; --bg-1:#101317; --surface:#171B21; --surface-2:#1D222A;
    --text:#EDEFF1; --text-dim:#9AA2AC; --text-faint:#5B636D; --border:#272D36;
    --shadow:0 10px 30px -12px rgba(0,0,0,0.6);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior-y:none; }
  body{
    margin:0; font-family:var(--font-sans);
    background: radial-gradient(120% 60% at 50% -10%, var(--bg-1), var(--bg-0));
    color:var(--text); min-height:100vh; min-height:100dvh; transition:background .4s ease, color .4s ease;
  }
  button{ touch-action:manipulation; -webkit-user-select:none; user-select:none; font-family:inherit; }
  input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--c-steel); outline-offset:2px; }

  .device{ display:flex; justify-content:center; align-items:center; min-height:100vh; min-height:100dvh; width:100%; }
  .app{
    position:relative; width:100%; max-width:430px; min-height:100vh; min-height:100dvh;
    padding:16px 18px 22px; padding-bottom:calc(22px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .notch{ display:none; }

  @media (min-width:640px){
    body{ background:#080a0c; }
    .device{ padding:40px 0; }
    .app{
      height:844px; max-height:92vh; max-height:92dvh; min-height:0;
      border-radius:46px; border:9px solid #05060a;
      box-shadow:0 40px 80px -24px rgba(0,0,0,.65), 0 0 0 1px #1c2027;
      padding-top:34px;
    }
    .notch{
      display:block; position:sticky; top:0; margin:-34px auto 10px;
      width:120px; height:22px; background:#05060a; border-radius:0 0 16px 16px; z-index:5;
    }
  }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-faint);
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dot{ width:6px;height:6px;border-radius:50%; background:var(--c-moss); box-shadow:0 0 0 3px var(--c-moss-soft); flex:0 0 auto; }
  .icon-btn{
    width:38px;height:38px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim);
    display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:15px; flex:0 0 auto;
  }
  .topbar-icons{ display:flex; gap:8px; }

  .greeting{ font-weight:800; font-size:22px; letter-spacing:-0.01em; margin:0; }
  .greeting span{ color:var(--text-dim); font-weight:600; }
  .gate-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }

  .clock-wrap{ display:flex; justify-content:center; }
  .flap-row{ display:flex; align-items:center; gap:6px; padding:14px 12px; background:var(--tile-bg); border-radius:var(--radius-lg); box-shadow:var(--shadow); }
  .flap-group{ display:flex; gap:3px; }
  .flap{ position:relative; width:29px; height:42px; border-radius:6px; background:linear-gradient(180deg,#22262E,#191C22); overflow:hidden; }
  .flap::after{ content:""; position:absolute; left:0;right:0;top:50%; height:1px; background:var(--tile-seam); transform:translateY(-.5px); }
  .flap .digit{ font-family:var(--font-mono); font-weight:600; font-size:25px; color:var(--tile-fg); width:100%;height:100%; display:flex;align-items:center;justify-content:center; transform-origin:center; }
  .flap.flip .digit{ animation:flipDigit .35s ease; }
  @keyframes flipDigit{ 0%{transform:rotateX(0);opacity:1;} 45%{transform:rotateX(85deg);opacity:.25;} 55%{transform:rotateX(-85deg);opacity:.25;} 100%{transform:rotateX(0);opacity:1;} }
  .flap-colon{ font-family:var(--font-mono); font-size:21px; color:#6B7481; padding:0 1px; }
  .date-row{ text-align:center; font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); }

  .status-card{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 16px 16px 20px; box-shadow:var(--shadow); overflow:hidden; }
  .status-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--accent); }
  .status-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .status-pill{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:4px 9px; border-radius:999px; }
  .status-label{ font-size:19px; font-weight:800; margin:2px 0 2px; }
  .status-msg{ font-size:14px; color:var(--text-dim); }
  .status-msg b{ color:var(--text); font-family:var(--font-mono); font-weight:600; }

  .cta{ display:flex; }
  .btn{
    flex:1 1 auto; border:none; border-radius:var(--radius-md); padding:14px 16px;
    font-weight:700; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease, filter .15s ease, opacity .15s ease; min-height:48px;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--c-moss); color:#fff; }
  .btn-secondary{ background:var(--surface); color:var(--text); border:1px solid var(--border); }
  .btn-ghost{ background:transparent; color:var(--c-steel); border:1px dashed var(--border); }
  .btn-warn{ background:transparent; color:var(--c-rust); border:1px solid var(--c-rust); }
  .btn-block{ width:100%; padding:16px; font-size:16px; }
  .btn-sm{ padding:9px 12px; font-size:13px; min-height:auto; }

  .panel-title{ display:flex; align-items:baseline; justify-content:space-between; margin:2px 2px 0; }
  .panel-title h2{ font-size:14px; margin:0; letter-spacing:.02em; }
  .panel-title span{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); }

  .timeline{ list-style:none; margin:10px 0 0; padding:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
  .t-item{ display:flex; gap:12px; padding:12px 16px; position:relative; border-bottom:1px solid var(--border); }
  .t-item:last-child{ border-bottom:none; }
  .t-rail{ display:flex; flex-direction:column; align-items:center; width:14px; }
  .t-dot{ width:9px; height:9px; border-radius:50%; background:var(--text-faint); margin-top:5px; flex:0 0 auto; }
  .t-line{ width:2px; flex:1; background:var(--border); margin-top:2px; }
  .t-time{ font-family:var(--font-mono); font-size:12.5px; font-weight:600; color:var(--text-dim); width:78px; flex:0 0 auto; padding-top:1px; }
  .t-label{ font-size:14.5px; font-weight:600; }
  .t-item.past{ opacity:.5; }
  .t-item.past .t-label{ text-decoration:line-through; }
  .t-item.past .t-dot{ background:var(--text-faint); }
  .t-item.current{ background:var(--accent-soft); }
  .t-item.current .t-dot{ background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .t-item.current .t-time{ color:var(--accent); }
  .t-empty{ padding:22px 16px; text-align:center; color:var(--text-faint); font-size:13.5px; }

  .day-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; }
  .nav-btn{ width:38px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:18px; cursor:pointer; line-height:1; }
  .today-btn{ padding:7px 14px; border-radius:999px; border:1px solid var(--c-steel); background:transparent; color:var(--c-steel); font-size:12.5px; font-weight:700; cursor:pointer; }
  .today-btn.hidden{ visibility:hidden; }
  .swipe-hint{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); letter-spacing:.06em; text-align:center; flex:1; }
  @keyframes slideInR{ from{ transform:translateX(42px); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes slideInL{ from{ transform:translateX(-42px); opacity:0; } to{ transform:none; opacity:1; } }
  .timeline.in-r{ animation:slideInR .25s ease; }
  .timeline.in-l{ animation:slideInL .25s ease; }

  /* ---------- Academic calendar ---------- */
  .cal-overlay{
    display:none; position:absolute; top:0; right:0; bottom:0; left:0; z-index:40;
    background:var(--bg-1); flex-direction:column; padding:16px 18px 18px; padding-bottom:calc(18px + env(safe-area-inset-bottom));
  }
  .cal-overlay.open{ display:flex; }
  @media (max-width:639px){ .cal-overlay{ position:fixed; } }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .cal-head h2{ font-size:17px; margin:0; flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-body{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 0 10px; }
  .cal-body textarea.name-input{ resize:vertical; font-family:inherit; font-size:13.5px; }
  .cal-body select.name-input{ appearance:auto; }
  .c-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; display:flex; flex-direction:column; gap:8px; }
  .c-center{ align-items:center; text-align:center; }
  .c-h{ font-weight:800; font-size:16px; }
  .c-h2{ font-size:13px; font-weight:700; margin:8px 2px 0; letter-spacing:.02em; }
  .c-p{ font-size:13px; color:var(--text-dim); line-height:1.45; }
  .c-empty{ text-align:center; color:var(--text-faint); font-size:13.5px; padding:18px 8px; }
  .c-foot{ font-size:11px; color:var(--text-faint); line-height:1.5; text-align:center; padding:6px 4px 2px; }
  .c-facts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .c-facts > div{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 9px; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .c-facts span{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); }
  .c-facts b{ font-size:14px; font-weight:800; }
  .c-facts small{ font-size:11px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .c-warn{ padding:10px 12px; border-radius:10px; font-size:12.5px; font-weight:600; line-height:1.4; }
  .c-warn.warn{ background:var(--c-amber-soft); color:var(--c-amber); }
  .c-warn.info{ background:var(--c-steel-soft); color:var(--c-steel); }
  .c-sub{ display:flex; justify-content:space-between; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; color:var(--text); cursor:pointer; }
  .c-sub-l{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .c-sub-n{ font-weight:800; font-size:15px; }
  .c-sub-s{ font-size:12px; color:var(--text-dim); }
  .c-bar{ height:6px; border-radius:99px; background:var(--border); overflow:hidden; margin:2px 0; }
  .c-bar i{ display:block; height:100%; background:var(--c-steel); border-radius:99px; }
  .c-big{ font-family:var(--font-mono); font-size:38px; font-weight:700; color:var(--c-moss); line-height:1; }
  .c-big2{ font-family:var(--font-mono); font-size:56px; font-weight:700; color:var(--c-moss); line-height:1; }
  .c-line{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:13px; }
  .c-ex{ flex-direction:column; align-items:flex-start; gap:4px; }
  .c-tag{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--border); color:var(--text-dim); white-space:nowrap; }
  .c-tag.holiday, .c-tag.rule{ background:var(--c-rust-soft); color:var(--c-rust); }
  .c-tag.exam, .c-tag.pending{ background:var(--c-amber-soft); color:var(--c-amber); }
  .c-tag.event, .c-tag.mine{ background:var(--c-steel-soft); color:var(--c-steel); }
  .c-tag.working{ background:var(--c-moss-soft); color:var(--c-moss); }
  .c-list{ display:flex; flex-direction:column; gap:8px; }
  .c-entry{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; display:flex; flex-direction:column; gap:6px; }
  .c-entry.past{ opacity:.55; }
  .c-entry-top{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .c-entry-t{ font-size:14.5px; font-weight:700; }
  .c-row2{ display:flex; gap:8px; align-items:center; }
  .c-row2 .btn{ flex:1; }
  .c-row2 .btn-sm{ flex:0 0 auto; }
  .c-grid2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:end; }
  .c-grid2 > *, .c-grid3 > *{ min-width:0; }
  .cal-body input[type=date], .cal-body input[type=time]{ min-width:0; width:100%; max-width:100%; }
  .c-grid3{ display:grid; grid-template-columns:1fr 1.5fr auto; gap:8px; align-items:center; }
  .c-check{ display:flex; gap:8px; align-items:center; font-size:13.5px; color:var(--text); }
  .c-check input{ width:18px; height:18px; flex:0 0 auto; }
  .c-counter{ justify-content:space-between; }
  .c-count{ font-family:var(--font-mono); font-size:18px; min-width:30px; text-align:center; }
  .c-link{ background:none; border:none; color:var(--c-steel); font-weight:700; font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0 4px; }
  .c-msg{ min-height:18px; font-size:12.5px; font-weight:600; text-align:center; color:var(--c-moss); }
  .c-msg.err{ color:var(--c-rust); } .c-msg.warn{ color:var(--c-amber); }
  footer{ text-align:center; font-size:11px; color:var(--text-faint); padding-top:2px; padding-bottom:2px; }

  /* ---------- Schedule editor overlay ---------- */
  .editor-overlay{
    display:none; position:absolute; top:0; right:0; bottom:0; left:0; z-index:30;
    background:var(--bg-1); flex-direction:column; padding:16px 18px 18px; padding-bottom:calc(18px + env(safe-area-inset-bottom));
  }
  .editor-overlay.open{ display:flex; }
  @media (max-width:639px){ .editor-overlay{ position:fixed; } }
  .editor-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .editor-head h2{ font-size:17px; margin:0; }
  .day-tabs{ display:flex; gap:6px; overflow-x:auto; padding:10px 0 4px; scrollbar-width:none; }
  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{
    flex:0 0 auto; padding:8px 13px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .day-tab.active{ background:var(--c-steel); border-color:var(--c-steel); color:#fff; }
  .day-count{ font-family:var(--font-mono); font-size:10px; opacity:.75; margin-left:4px; }

  .editor-list{ flex:1; overflow-y:auto; margin-top:8px; display:flex; flex-direction:column; gap:8px; padding-bottom:8px; }
  .editor-row{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:10px; display:grid; grid-template-columns:1fr 1fr auto; gap:6px; align-items:center;
  }
  .editor-row input[type="time"]{
    width:100%; padding:8px 6px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13px;
  }
  .editor-row input[type="text"]{
    grid-column:1 / -1; width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13.5px;
  }
  .row-del{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--c-rust); font-size:15px; cursor:pointer;
  }
  .editor-empty{ text-align:center; color:var(--text-faint); font-size:13px; padding:24px 0; }
  .editor-note{ min-height:18px; padding-top:8px; font-size:12.5px; font-weight:600; color:var(--c-moss); text-align:center; }
  .editor-actions{ display:flex; gap:8px; padding-top:10px; }
  #scanBtn{ color:var(--c-steel); border-color:var(--c-steel); }
  #scanBtn:disabled{ opacity:.5; }
  .name-label{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); margin-top:8px; }
  .name-input{ width:100%; margin-top:4px; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; font-weight:600; }
  .greeting{ cursor:pointer; }
  .editor-footer{ display:flex; gap:8px; padding-top:10px; }
</style>
</head>
<body data-theme="light">
  <div class="device">
    <div class="app" id="app">
      <div class="notch"></div>

      <div class="topbar">
        <div class="eyebrow"><span class="dot" id="pulseDot"></span>BunkSafe</div>
        <div class="topbar-icons">
          <button class="icon-btn" id="calBtn" aria-label="Academic calendar">📅</button>
          <button class="icon-btn" id="editBtn" aria-label="Edit schedule">✎</button>
          <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button>
        </div>
      </div>

      <h1 class="greeting" id="greeting">Good morning, <span>Maya</span></h1>
      <div class="gate-sub" id="gateSub">Loading schedule…</div>

      <div class="clock-wrap"><div class="flap-row" id="flapRow" aria-label="Current time"></div></div>
      <div class="date-row" id="dateRow"></div>

      <div class="status-card" id="statusCard">
        <div class="status-top"><span class="status-pill" id="statusPill">Loading</span></div>
        <div class="status-label" id="statusLabel">—</div>
        <div class="status-msg" id="statusMsg">—</div>
      </div>

      <div class="cta" id="cta"></div>

      <div class="panel-title">
        <h2 id="panelTitle">Today's classes</h2>
        <span id="scheduleRange"></span>
      </div>
      <div class="day-nav">
        <button class="nav-btn" id="prevDay" aria-label="Previous day">‹</button>
        <button class="today-btn hidden" id="todayBtn">Today</button>
        <div class="swipe-hint" id="swipeHint">‹ swipe ›</div>
        <button class="nav-btn" id="nextDay" aria-label="Next day">›</button>
      </div>
      <ul class="timeline" id="timeline"></ul>

      <footer>Swipe left or right on the schedule to change day. Swipe right on empty space to open the calendar. Tap ✎ to scan or edit your timetable.<br><span style="opacity:.8">Version 2026.10.27-7</span></footer>

      <!-- ---------------- Academic calendar ---------------- -->
      <div class="cal-overlay" id="calOverlay">
        <div class="cal-head">
          <button class="icon-btn" id="calBack" aria-label="Back">‹</button>
          <h2 id="calTitle">Academic calendar</h2>
          <button class="icon-btn" id="calClose" aria-label="Close">✕</button>
        </div>
        <div class="day-tabs" id="calTabs"></div>
        <div class="cal-body" id="calBody"></div>
      </div>

      <!-- ---------------- Editor overlay ---------------- -->
      <div class="editor-overlay" id="editorOverlay">
        <div class="editor-head">

/* ---------- Image clean-up before OCR: threshold + remove table grid lines ---------- */
function cleanForOCR(gray, w, h, flip){
  const n = w * h;
  const hist = new Array(256).fill(0);
  for (let i = 0; i < n; i++) hist[gray[i]]++;
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, best = -1, thr = 128;
  for (let t = 0; t < 256; t++){
    wB += hist[t]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best){ best = between; thr = t; }
  }
  let dark = new Uint8Array(n), darkCount = 0;
  for (let i = 0; i < n; i++){ if (gray[i] <= thr){ dark[i] = 1; darkCount++; } }
  if (flip || darkCount > n * 0.5){ for (let i = 0; i < n; i++) dark[i] = dark[i] ? 0 : 1; }   // light text on dark page (or forced second pass)

  const L = Math.max(50, Math.round(Math.max(w, h) * 0.03));
  const kill = new Uint8Array(n);
  for (let y = 0; y < h; y++){
    let x = 0;
    while (x < w){
      if (!dark[y * w + x]){ x++; continue; }
      let e = x; while (e < w && dark[y * w + e]) e++;
      if (e - x >= L) for (let k = x; k < e; k++) kill[y * w + k] = 1;
      x = e;
    }
  }
  for (let x = 0; x < w; x++){
    let y = 0;
    while (y < h){
      if (!dark[y * w + x]){ y++; continue; }
      let e = y; while (e < h && dark[e * w + x]) e++;
      if (e - y >= L) for (let k = y; k < e; k++) kill[k * w + x] = 1;
      y = e;
    }
  }
  const out = new Uint8ClampedArray(n).fill(255);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = y * w + x;
    if (!dark[i]) continue;
    // also drop dark pixels hugging a removed line (anti-aliasing edge)
    let near = kill[i];
    if (!near){
      if ((x > 0 && kill[i-1]) || (x < w-1 && kill[i+1]) || (y > 0 && kill[i-w]) || (y < h-1 && kill[i+w])) near = 1;
    }
    if (!near) out[i] = 0;
  }
  return out;
}


/* ---------- Timetable image parser (works on OCR word boxes) ---------- */
function parseTimetableWords(rawWords){
  const DAY_PATTERNS = [
    ['Sunday',    /^sun(day)?\.?$/i],
    ['Monday',    /^mon(day)?\.?$/i],
    ['Tuesday',   /^tue(s|sday)?\.?$/i],
    ['Wednesday', /^wed(nesday)?\.?$/i],
    ['Thursday',  /^thu(r|rs|rsday)?\.?$/i],
    ['Friday',    /^fri(day)?\.?$/i],
    ['Saturday',  /^sat(urday)?\.?$/i]
  ];
  const DAY_NAMES = DAY_PATTERNS.map(d => d[0]);
  const words = rawWords
    .map(w => ({ text:String(w.text||'').trim(), x0:w.x0, y0:w.y0, x1:w.x1, y1:w.y1, conf:w.conf }))
    .filter(w => w.text && isFinite(w.x0) && isFinite(w.y0) && w.x1 > w.x0 && w.y1 > w.y0 && !/^[|_\-–—=~.,:;'"`!\[\]{}()\\\/]+$/.test(w.text));
  if (words.length < 8) throw new Error('I could not read enough text from this image.');

  // 1. day labels
  const cands = [];
  words.forEach(w => {
    const t = w.text.replace(/[^A-Za-z.]/g,'');
    for (const [name, re] of DAY_PATTERNS){ if (re.test(t)){ cands.push({ day:name, box:w }); break; } }
  });
  const dayNamesFound = new Set(cands.map(c => c.day));
  if (dayNamesFound.size < 2) throw new Error('I could not find day names (Mon, Tue, Wed…) in the image.');

  const cx = b => (b.x0 + b.x1) / 2, cy = b => (b.y0 + b.y1) / 2;
  const spreadX = Math.max(...cands.map(c => cx(c.box))) - Math.min(...cands.map(c => cx(c.box)));
  const spreadY = Math.max(...cands.map(c => cy(c.box))) - Math.min(...cands.map(c => cy(c.box)));
  const daysAreRows = spreadY >= spreadX;
  const dayAxis = daysAreRows ? 'y' : 'x';
  const timeAxis = daysAreRows ? 'x' : 'y';
  const lo = (b, ax) => ax === 'x' ? b.x0 : b.y0;
  const hi = (b, ax) => ax === 'x' ? b.x1 : b.y1;
  const mid = (b, ax) => (lo(b, ax) + hi(b, ax)) / 2;

  // one label per day: the one nearest the start of the time axis
  const labels = [];
  dayNamesFound.forEach(day => {
    const list = cands.filter(c => c.day === day).sort((a,b) => mid(a.box, timeAxis) - mid(b.box, timeAxis));
    labels.push({ day, box:list[0].box });
  });
  labels.sort((a,b) => mid(a.box, dayAxis) - mid(b.box, dayAxis));
  const labelSet = new Set(labels.map(l => l.box));

  // day bands
  const centers = labels.map(l => mid(l.box, dayAxis));
  const bandEdges = [];
  for (let i = 0; i <= labels.length; i++){
    if (i === 0) bandEdges.push(centers[0] - (centers[1] - centers[0]) / 2);
    else if (i === labels.length) bandEdges.push(centers[i-1] + (centers[i-1] - centers[i-2]) / 2);
    else bandEdges.push((centers[i-1] + centers[i]) / 2);
  }
  const firstBand = bandEdges[0], lastBand = bandEdges[bandEdges.length - 1];

  // 2. time header
  const TIME_RE = /(\d{1,2})\s*[:.;]\s*(\d{2})/g;
  const items = [];
  let twoInWord = false;
  words.forEach(w => {
    if (labelSet.has(w)) return;
    if (mid(w, dayAxis) >= firstBand) return;
    const text = w.text; let m, n = 0; const found = [];
    TIME_RE.lastIndex = 0;
    while ((m = TIME_RE.exec(text)) !== null){
      let h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
      if (h > 23 || mi > 59) continue;
      if (h >= 1 && h <= 6) h += 12;
      found.push({ value:h * 60 + mi, frac:(m.index + m[0].length / 2) / text.length });
    }
    if (found.length >= 2) twoInWord = true;
    found.forEach(f => items.push({ value:f.value, pos:lo(w, timeAxis) + f.frac * (hi(w, timeAxis) - lo(w, timeAxis)) }));
  });
  if (items.length < 2) throw new Error('I could not find period times (like 08:00) above or beside the classes.');

  const byValue = new Map();
  items.forEach(it => { if (!byValue.has(it.value)) byValue.set(it.value, []); byValue.get(it.value).push(it.pos); });
  const values = [...byValue.keys()].sort((a,b) => a - b);
  const meanPos = v => { const a = byValue.get(v); return a.reduce((s,x) => s + x, 0) / a.length; };
  const rangeMode = twoInWord || [...byValue.values()].some(a => a.length >= 2);

  let cols = []; // {start,end,lo,hi}
  if (rangeMode){
    const P = values.map(meanPos);
    const m = values.length - 1;
    if (m < 2) throw new Error('I found too few period times to build a grid.');
    const b = new Array(m + 1);
    for (let k = 1; k <= m - 1; k++) b[k] = P[k];
    b[0] = m >= 3 ? b[1] - (b[2] - b[1]) : 2 * P[0] - b[1];
    b[m] = m >= 3 ? b[m-1] + (b[m-1] - b[m-2]) : 2 * P[m] - b[m-1];
    for (let k = 0; k < m; k++) cols.push({ start:values[k], end:values[k+1], lo:b[k], hi:b[k+1] });
  } else {
    const P = values.map(meanPos);
    const n = values.length;
    if (n < 2) throw new Error('I found too few period times to build a grid.');
    const durs = []; for (let k = 0; k < n - 1; k++) durs.push(values[k+1] - values[k]);
    durs.sort((a,b) => a - b);
    const medDur = durs[Math.floor(durs.length / 2)] || 50;
    const b = new Array(n + 1);
    for (let k = 1; k < n; k++) b[k] = (P[k-1] + P[k]) / 2;
    b[0] = P[0] - (P[1] - P[0]) / 2;
    b[n] = P[n-1] + (P[n-1] - P[n-2]) / 2;
    for (let k = 0; k < n; k++) cols.push({ start:values[k], end:k < n - 1 ? values[k+1] : values[k] + medDur, lo:b[k], hi:b[k+1] });
  }
  cols.sort((a,b) => a.lo - b.lo);
  const gridLo = cols[0].lo, gridHi = cols[cols.length - 1].hi;

  // 3. body words
  const body = words.filter(w => !labelSet.has(w)
    && mid(w, dayAxis) >= firstBand && mid(w, dayAxis) <= lastBand
    && mid(w, timeAxis) >= gridLo && mid(w, timeAxis) <= gridHi);
  const heights = body.map(w => w.y1 - w.y0).sort((a,b) => a - b);
  const H = heights.length ? heights[Math.floor(heights.length / 2)] : 14;
  const gap = (a, b, ax) => Math.max(0, Math.max(lo(a, ax) - hi(b, ax), lo(b, ax) - hi(a, ax)));

  const fmt = v => String(Math.floor(v / 60)).padStart(2,'0') + ':' + String(v % 60).padStart(2,'0');
  const SKIP = /^(lunch|break|recess|interval|short break|lunch break)$/i;
  const schedule = {}; DAY_NAMES.forEach(d => schedule[d] = []);
  let total = 0;

  labels.forEach((lab, li) => {
    const bandLo = bandEdges[li], bandHi = bandEdges[li + 1];
    const ws = body.filter(w => mid(w, dayAxis) >= bandLo && mid(w, dayAxis) < bandHi);
    // union-find clusters
    const parent = ws.map((_, i) => i);
    const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
    for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++){
      const gx = gap(ws[i], ws[j], 'x'), gy = gap(ws[i], ws[j], 'y');
      const sameLine = gy < 0.3 * H && gx < 1.1 * H;      // words next to each other
      const stacked  = gx === 0 && gy < 1.4 * H;           // lines of one cell, one under another
      if (sameLine || stacked) parent[find(i)] = find(j);
    }
    const groups = new Map();
    ws.forEach((w, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(w); });

    groups.forEach(g => {
      const box = { x0:Math.min(...g.map(w => w.x0)), y0:Math.min(...g.map(w => w.y0)), x1:Math.max(...g.map(w => w.x1)), y1:Math.max(...g.map(w => w.y1)) };
      // text: lines top-to-bottom, words left-to-right
      const sorted = g.slice().sort((a,b) => cy(a) - cy(b));
      const lines = []; 
      sorted.forEach(w => {
        const last = lines[lines.length - 1];
        if (last && Math.abs(cy(w) - last.cy) <= 0.6 * H){ last.ws.push(w); last.cy = (last.cy * (last.ws.length - 1) + cy(w)) / last.ws.length; }
        else lines.push({ cy:cy(w), ws:[w] });
      });
      const lineTexts = lines.map(l => l.ws.sort((a,b) => a.x0 - b.x0).map(w => w.text).join(' ')
        .replace(/[|_\[\]{}\\~]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
      if (!lineTexts.length) return;
      let label;
      const lastLine = lineTexts[lineTexts.length - 1];
      if (lineTexts.length > 1 && /\d/.test(lastLine)) label = lineTexts.slice(0, -1).join(' ') + ' — ' + lastLine;
      else label = lineTexts.join(' ');
      label = label.replace(/^[\s\-–—:.,]+|[\s\-–—:.,]+$/g,'');
      if (label.indexOf(' — ') < 0){ const sp = calSplitRoom(label); if (sp.room && sp.name) label = sp.name + ' — ' + sp.room; }
      if (label.length < 2 || !/[A-Za-z0-9]/.test(label) || SKIP.test(label)) return;

      // which columns does this cluster cover?
      const cl = lo(box, timeAxis), ch = hi(box, timeAxis), cw = ch - cl;
      const covered = [];
      cols.forEach((c, k) => {
        const ov = Math.min(ch, c.hi) - Math.max(cl, c.lo);
        if (ov > 0 && ov >= 0.3 * Math.min(c.hi - c.lo, cw)) covered.push(k);
      });
      if (!covered.length){
        const m = (cl + ch) / 2; const k = cols.findIndex(c => m >= c.lo && m < c.hi);
        if (k < 0) return; covered.push(k);
      }
      const a = Math.min(...covered), z = Math.max(...covered);
      schedule[lab.day].push({ start:fmt(cols[a].start), end:fmt(cols[z].end), label });
      total++;
    });
    schedule[lab.day].sort((a,b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0);
  });

  if (!total) throw new Error('I found the grid but could not read any class names.');
  return { schedule, daysFound:labels.map(l => l.day), total, periods:cols.length, orientation:daysAreRows ? 'rows' : 'columns' };
}

    if (current){
      return { pill:'In class', label:'In Class', accent:'moss',
        msg:`<b>${current.label}</b> · ends in <b>${fmtDuration(current.end - now)}</b>` };
    }
    const next = todaySlots.find(s => s.start > now);
    if (next){
      const prevEnd = [...todaySlots].reverse().find(s => s.end <= now);
      if (prevEnd){
        return { pill:'Free period', label:'Free Period', accent:'amber',
          msg:`Next: <b>${next.label}</b> in <b>${fmtDuration(next.start - now)}</b>` };
      }
      return { pill:'Upcoming', label:'Upcoming Class', accent:'steel',
        msg:`<b>${next.label}</b> starts in <b>${fmtDuration(next.start - now)}</b>` };
    }

  /* ---------------- Scan timetable from an image ---------------- */
  const scanBtn   = document.getElementById('scanBtn');

  function setNote(msg, kind){
    editorNote.textContent = msg || '';

  }
  let tessPromise = null, tessWorker = null, progressHandler = null;
  function loadTesseract(){
    if (window.Tesseract) return Promise.resolve();
    if (!tessPromise) tessPromise = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
      s.onload = res;
      s.onerror = () => { tessPromise = null; rej(new Error('NETWORK')); };
      document.head.appendChild(s);
    });
    return tessPromise;
  }
  async function getWorker(){
    if (!tessWorker){
      tessWorker = await window.Tesseract.createWorker('eng', 1, { logger: m => { if (progressHandler) progressHandler(m); } });
      await tessWorker.setParameters({ tessedit_pageseg_mode: '11' });
    }
    return tessWorker;
  }
  function loadImage(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => res({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('BADIMAGE')); };
      img.src = url;
    });
  }
  async function prepareGray(file){
    const { img, url } = await loadImage(file);
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const sc = Math.min(2.5, 2400 / Math.max(iw, ih));
    const w = Math.round(iw * sc), h = Math.round(ih * sc);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently:true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const d = ctx.getImageData(0, 0, w, h).data;
    const gray = new Uint8ClampedArray(w * h);
    for (let i = 0, j = 0; i < gray.length; i++, j += 4) gray[i] = (d[j] * 299 + d[j+1] * 587 + d[j+2] * 114) / 1000;
    return { gray, w, h };
  }
  function grayToCanvas(g, w, h){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    const im = ctx.createImageData(w, h);
    for (let i = 0, j = 0; i < g.length; i++, j += 4){ im.data[j] = im.data[j+1] = im.data[j+2] = g[i]; im.data[j+3] = 255; }
    ctx.putImageData(im, 0, 0);
    return c;
  }
  async function ocrWords(worker, gray, w, h, flip){
    const canvas = grayToCanvas(cleanForOCR(gray, w, h, flip), w, h);
    const { data } = await worker.recognize(canvas);
    return (data.words || []).map(x => ({ text:x.text, x0:x.bbox.x0, y0:x.bbox.y0, x1:x.bbox.x1, y1:x.bbox.y1, conf:x.confidence }));
  }
  function isDayOrTime(w){
    return /\d\s*[:.;]\s*\d{2}/.test(w.text) || /^(mon|tue|wed|thu|fri|sat|sun)/i.test(w.text.replace(/[^A-Za-z]/g, ''));
  }
  function mergeExtra(first, extra){
    const have = first.filter(isDayOrTime);
    const inside = (w, o) => { const cx = (w.x0 + w.x1) / 2, cy = (w.y0 + w.y1) / 2; return cx >= o.x0 && cx <= o.x1 && cy >= o.y0 && cy <= o.y1; };
    return first.concat(extra.filter(w => isDayOrTime(w) && !have.some(o => inside(w, o))));
  }
  function tryParse(words){
    try{ return parseTimetableWords(words); }
    catch(e){ e.isParse = true; throw e; }
  }

  scanBtn.addEventListener('click', () => scanInput.click());
  scanInput.addEventListener('change', async () => {
    const file = scanInput.files && scanInput.files[0];
    scanInput.value = '';
    if (!file) return;
    scanBtn.disabled = true;
    try{
      setNote('Loading the reader… (needs internet the first time)', 'warn');
      await loadTesseract();
      const worker = await getWorker();
      progressHandler = m => {
        if (m.status === 'recognizing text') setNote('Reading your timetable… ' + Math.round((m.progress || 0) * 100) + '%', 'warn');
      };
      setNote('Preparing image…', 'warn');
      const { gray, w, h } = await prepareGray(file);
      const words = await ocrWords(worker, gray, w, h, false);
      let result;
      try{ result = tryParse(words); }
      catch(e1){
        if (!e1.isParse) throw e1;
        setNote('Trying a second pass…', 'warn');
        const extra = await ocrWords(worker, gray, w, h, true);
        result = tryParse(mergeExtra(words, extra));
      }
      result.daysFound.forEach(d => { draftSchedule[d] = result.schedule[d]; });
      renderDayTabs();
      renderEditorList();
      setNote('Found ' + result.total + ' class' + (result.total > 1 ? 'es' : '') + ' on ' + result.daysFound.length + ' days. Please check each day, fix any mistakes, then tap Save Timetable.', 'ok');
    }catch(err){
      if (err && err.isParse) setNote(err.message + ' Try a clearer, straight-on screenshot or photo, or add classes by hand.', 'err');
      else if (err && err.message === 'NETWORK') setNote('Could not load the reader. Check your internet and try again.', 'err');
      else if (err && err.message === 'BADIMAGE') setNote('That file could not be opened as an image.', 'err');
      else setNote('Something went wrong while reading the image. Please try again.', 'err');
    }finally{
      scanBtn.disabled = false;
      progressHandler = null;
    }
  });

  /* ---------------- Academic calendar: engine ---------------- */
/* ---------------- Academic calendar engine (pure logic, no DOM) ---------------- */
const CAL_DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const calPad = n => String(n).padStart(2, '0');
function calIso(d){ return d.getFullYear() + '-' + calPad(d.getMonth() + 1) + '-' + calPad(d.getDate()); }
function calParse(s){ const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12, 0, 0); }
function calAdd(iso, n){ const d = calParse(iso); d.setDate(d.getDate() + n); return calIso(d); }
function calValidIso(s){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ''))) return false;
  const d = calParse(s); return calIso(d) === s;
}
function calWeekday(iso){ return CAL_DAYS[calParse(iso).getDay()]; }
function calOrdinal(iso){ return Math.floor((calParse(iso).getDate() - 1) / 7) + 1; }
function calDiffDays(a, b){ return Math.round((calParse(b) - calParse(a)) / 864e5); }

/* Split "CN VIB 403" / "CN — VIB 403" / "Maths II (NYB-313)" into subject and room */
const CAL_ROOM_SKIP = /^(LAB|ROOM|UNIT|PART|SEM|YEAR|CLASS|SEC|BATCH|GROUP|SET|PAPER)$/;
function calSplitRoom(text){
  let name = String(text || '').trim(), room = '';
  const dash = name.split(/\s+[—–|]\s+|\s+-\s+/);
  if (dash.length > 1){ name = dash[0].trim(); room = dash.slice(1).join(' ').trim(); }
  for (let i = 0; i < 2; i++){
    const m = /^(.*\S)(?:\s+|\s*[\(\[]\s*)(?:room\s*)?([A-Z]{2,4})[\s\-]?(\d{1,4}[A-Za-z]?)\s*[\)\]]?$/.exec(name);
    if (!m || CAL_ROOM_SKIP.test(m[2])) break;
    room = (m[2] + ' ' + m[3] + (room ? ' ' + room : '')).trim();
    name = m[1].replace(/[\s\-–—|,(:]+$/, '').trim();
  }
  return { name, room };
}
/* Subject name from a timetable label such as "Python Lab — VIB 411" (rooms are never part of the subject) */
function calSubjectOf(label, aliases){
  const raw = calSplitRoom(label).name;
  const isLab = /\b(lab|laboratory|practical)\b/i.test(raw);
  let name = raw;                       // "Python" and "Python Lab" are separate subjects
  const key = name.toLowerCase();
  if (aliases && aliases[key]) name = aliases[key];
  return { name, isLab, raw };
}
function calSessionsFor(schedule, weekday, aliases){
  return (schedule[weekday] || [])
    .filter(s => s && s.start && s.end && s.label)
    .map(s => { const sub = calSubjectOf(s.label, aliases); return { start:s.start, end:s.end, label:s.label, subject:sub.name, isLab:sub.isLab }; })
    .sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0);
}
const calCovers = (e, iso) => e.start <= iso && iso <= (e.end || e.start);
const calIsFull = e => (e.category === 'holiday' || e.category === 'exam' || e.category === 'event') && e.scope !== 'partial';
const calIsPartial = e => (e.category === 'holiday' || e.category === 'exam' || e.category === 'event') && e.scope === 'partial' && e.from && e.to;
const calReason = e => ({ entryId:e.id, category:e.category, title:e.title || e.category });

/* Classify one date. Returns { kind:'normal'|'working'|'excluded', reason, useDay, partials, conflict } */
function calClassify(iso, cal){
  const all = (cal.entries || []).filter(e => e.status !== 'pending' && calCovers(e, iso));
  const bucket = origin => ({
    work: all.filter(e => e.origin === origin && e.category === 'working'),
    excl: all.filter(e => e.origin === origin && calIsFull(e))
  });
  const off = bucket('official'), usr = bucket('user');
  const partials = all.filter(calIsPartial);
  const wd = calWeekday(iso), ord = calOrdinal(iso);
  const rule = (cal.rules || []).find(r => r.enabled && r.weekday === wd && Number(r.ordinal) === ord);
  const levels = cal.userWins ? [usr, off] : [off, usr];
  let out = null, conflict = false;
  for (const lv of levels){
    if (lv.work.length){ out = { kind:'working', reason:calReason(lv.work[0]), useDay:lv.work[0].useDay || '' }; conflict = lv.excl.length > 0; break; }
    if (lv.excl.length){ out = { kind:'excluded', reason:calReason(lv.excl[0]) }; break; }
  }
  if (!out && rule) out = { kind:'excluded', reason:{ entryId:null, category:'rule', title:'Recurring rule: ' + ['','1st','2nd','3rd','4th','5th'][ord] + ' ' + wd } };
  if (!out) out = { kind:'normal', reason:null };
  out.partials = partials; out.conflict = conflict;
  return out;
}

const calOverlap = (s, e, from, to) => s < to && e > from;

/* Sessions held/excluded on one date */
function calDay(iso, cal, schedule){
  const info = calClassify(iso, cal);
  const tableDay = (info.kind === 'working' && info.useDay) ? info.useDay : calWeekday(iso);
  const sessions = calSessionsFor(schedule, tableDay, cal.aliases);
  const counted = [], excluded = [];
  sessions.forEach(s => {
    if (info.kind === 'excluded'){ excluded.push(Object.assign({ date:iso, reason:info.reason }, s)); return; }
    const hit = info.partials.find(p => calOverlap(s.start, s.end, p.from, p.to));
    if (hit) excluded.push(Object.assign({ date:iso, reason:calReason(hit) }, s));
    else counted.push(Object.assign({ date:iso }, s));
  });
  return { date:iso, info, counted, excluded, workingNoTimetable: info.kind === 'working' && sessions.length === 0 };
}

function calHash(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

/* Main calculation */
function calCompute(cal, schedule, todayIso, nowIso){
  const sem = cal.semester || {};
  const warnings = [];
  if (!calValidIso(sem.start) || !calValidIso(sem.end)) return { ok:false, code:'semester', error:'Set the semester start and end dates first.', warnings };
  if (sem.end < sem.start) return { ok:false, code:'order', error:'The semester end date is earlier than the start date.', warnings };
  const hasTimetable = CAL_DAYS.some(d => (schedule[d] || []).some(s => s && s.start && s.end && s.label));
  if (!hasTimetable) return { ok:false, code:'timetable', error:'Your timetable is empty. Add or scan your timetable first.', warnings };

  let calc = calValidIso(cal.calcDate) ? cal.calcDate : todayIso;
  if (calc < sem.start){ warnings.push({ type:'info', text:'The calculation date is before the semester starts, so counting begins on ' + sem.start + '.' }); calc = sem.start; }
  if (calc > sem.end) warnings.push({ type:'info', text:'The calculation date is after the semester end, so nothing remains.' });

  const subjects = new Map();
  const get = name => { if (!subjects.has(name)) subjects.set(name, { name, rem:{ total:0, lec:0, lab:0 }, done:{ total:0, lec:0, lab:0 }, dates:[], excluded:[] }); return subjects.get(name); };
  // make sure every timetable subject shows up, even with zero left
  CAL_DAYS.forEach(d => calSessionsFor(schedule, d, cal.aliases).forEach(s => get(s.subject)));

  const bump = (o, s) => { o.total++; if (s.isLab) o.lab++; else o.lec++; };
  const conflicts = [], noTable = [];
  let nextHoliday = null, nextTeaching = null; const upcoming = [];

  // completed: semester start .. day before calculation date
  for (let d = sem.start; d < calc && d <= sem.end; d = calAdd(d, 1)){
    calDay(d, cal, schedule).counted.forEach(s => bump(get(s.subject).done, s));
  }
  // remaining: calculation date .. semester end (inclusive)
  for (let d = calc; d <= sem.end; d = calAdd(d, 1)){
    const day = calDay(d, cal, schedule);
    if (day.info.conflict) conflicts.push(d);
    if (day.workingNoTimetable) noTable.push(d);
    day.counted.forEach(s => { const sub = get(s.subject); bump(sub.rem, s); sub.dates.push({ date:d, start:s.start, end:s.end, label:s.label, isLab:s.isLab }); });
    day.excluded.forEach(s => get(s.subject).excluded.push({ date:d, start:s.start, end:s.end, label:s.label, isLab:s.isLab, reason:s.reason }));
    if (!nextTeaching && day.counted.length) nextTeaching = d;
    const r = day.info.kind === 'excluded' ? day.info.reason : null;
    if (!nextHoliday && r && (r.category === 'holiday' || r.category === 'rule')) nextHoliday = { date:d, title:r.title };
    if (upcoming.length < 6){
      const ex = day.info.kind === 'excluded' && r && (r.category === 'exam' || r.category === 'event') ? r : (day.excluded.find(x => x.reason.category === 'exam' || x.reason.category === 'event') || {}).reason;
      if (ex && (ex.category === 'exam' || ex.category === 'event') && !upcoming.some(u => u.date === d)) upcoming.push({ date:d, category:ex.category, title:ex.title, partial: day.info.kind !== 'excluded' });
    }
  }
  const pending = (cal.entries || []).filter(e => e.status === 'pending').length;
  if (pending) warnings.push({ type:'warn', text:pending + ' calendar entr' + (pending > 1 ? 'ies are' : 'y is') + ' waiting for your confirmation and not counted yet.' });
  if (conflicts.length) warnings.push({ type:'warn', text:'The official calendar conflicts with itself on ' + conflicts.slice(0, 3).join(', ') + (conflicts.length > 3 ? ' and more' : '') + '. The working-day entry was used. Please review.' });
  if (noTable.length) warnings.push({ type:'warn', text:'Working day without a timetable: ' + noTable.slice(0, 3).join(', ') + '. Choose which weekday timetable it follows.' });
  if (!(cal.entries || []).length && !(cal.rules || []).some(r => r.enabled)) warnings.push({ type:'info', text:'No holidays, exams or rules added yet, so every timetable day is counted.' });
  if (cal.updatedAt && nowIso){ const age = calDiffDays(String(cal.updatedAt).slice(0, 10), nowIso.slice(0, 10)); if (age > 30) warnings.push({ type:'info', text:'The calendar was last changed ' + age + ' days ago. Check whether the university published a revision.' }); }

  const list = [...subjects.values()].sort((a, b) => a.name.localeCompare(b.name));
  // attendance planner: attend at least ceil(target% x total), so you may miss total - that
  const pct = Number(cal.attendancePct) > 0 && Number(cal.attendancePct) <= 100 ? Number(cal.attendancePct) : 75;
  const need = n => Math.ceil(n * pct / 100 - 1e-9);
  let T = 0, D = 0, R = 0, sumAbs = 0, sumMissed = 0;
  list.forEach(s => {
    s.total = s.rem.total + s.done.total;
    s.required = need(s.total);
    s.maxAbs = s.total - s.required;
    s.missed = (cal.missed && Number(cal.missed[s.name])) || 0;
    s.left = s.maxAbs - s.missed;
    T += s.total; D += s.done.total; R += s.rem.total; sumAbs += s.maxAbs; sumMissed += s.missed;
  });
  const att = { pct, total:T, done:D, remaining:R, required:need(T), maxAbs:T - need(T), subjectSum:sumAbs, missed:sumMissed };
  return {
    ok:true, calc, semEnd:sem.end, subjects:list, att, nextHoliday, nextTeaching, upcoming, warnings,
    snapshot:{ calculatedAt:nowIso || '', calendarVersion:cal.updatedAt || '', timetableVersion:calHash(JSON.stringify(schedule)) }
  };
}


  /* ---------------- Academic calendar: importer ---------------- */
/* ---------------- Calendar import: turn text / rows into candidate entries ---------------- */
const CAL_MON = 'jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?';
const CAL_MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
const calMonthNo = s => CAL_MONTHS[String(s).slice(0, 3).toLowerCase()];
const CAL_JOIN = '(?:-|–|—|to|till|until|through|thru)';

function calPickYear(m, d, o){
  const s = o && o.semStart, e = o && o.semEnd;
  if (s && e){
    const ys = Number(s.slice(0, 4)), ye = Number(e.slice(0, 4));
    for (let y = ys; y <= ye; y++){ const iso = y + '-' + calPad(m) + '-' + calPad(d); if (iso >= s && iso <= e) return y; }
    return ys;
  }
  return (o && o.year) || new Date().getFullYear();
}
function calMake(y, m, d){ const iso = y + '-' + calPad(m) + '-' + calPad(d); return calValidIso(iso) ? iso : null; }
const calYear = (s, m, d, o) => s ? (s.length === 2 ? 2000 + Number(s) : Number(s)) : calPickYear(m, d, o);

/* find every date or date range in a line; returns { items:[{start,end,uncertain,index,length}], rest } */
function calFindDates(text, o){
  let work = String(text);
  const found = [];
  const take = (re, fn) => {
    work = work.replace(re, (...a) => {
      const idx = a[a.length - 2]; const full = a[0];

  /* ----- import helpers ----- */
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const IMPORT_MAX_MB = 15;
  function calLoadScript(src, test){
    if (test()) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = () => rej(new Error('NETWORK'));
      document.head.appendChild(s);
    });
  }
  function wordsToLines(words){
    if (!words.length) return [];
    const hs = words.map(w => w.y1 - w.y0).sort((a, b) => a - b);
    const H = hs[Math.floor(hs.length / 2)] || 14;
    const sorted = words.slice().sort((a, b) => (a.y0 + a.y1) - (b.y0 + b.y1));
    const lines = [];
    sorted.forEach(w => {
      const cy = (w.y0 + w.y1) / 2, last = lines[lines.length - 1];
      if (last && Math.abs(cy - last.cy) <= 0.6 * H){ last.ws.push(w); last.cy = (last.cy * (last.ws.length - 1) + cy) / last.ws.length; }
      else lines.push({ cy, ws:[w] });
    });
    return lines.map(l => {
      l.ws.sort((a, b) => a.x0 - b.x0);
      let out = '';
      l.ws.forEach((w, i) => { if (i) out += (w.x0 - l.ws[i - 1].x1 > 1.5 * H) ? ' | ' : ' '; out += w.text; });
      return out;
    });
  }
  /* pdf.js text items -> lines (items: {text,x0,x1,y,h}) */
  function pdfItemsToLines(items){
    const sorted = items.slice().sort((a, b) => b.y - a.y || a.x0 - b.x0);
    const lines = [];
    sorted.forEach(it => {
      const last = lines[lines.length - 1];
      if (last && Math.abs(last.y - it.y) <= Math.max(2.5, it.h * 0.35)) last.its.push(it);
      else lines.push({ y:it.y, its:[it] });
    });
    return lines.map(l => {
      l.its.sort((a, b) => a.x0 - b.x0);
      let out = '';
      l.its.forEach((it, i) => { if (i){ const gap = it.x0 - l.its[i - 1].x1; out += gap > 14 ? ' | ' : (gap > 1 ? ' ' : ''); } out += it.text; });
      return out;
    });
  }
  function canvasGray(cv){
    const ctx = cv.getContext('2d', { willReadFrequently:true });
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    const g = new Uint8ClampedArray(cv.width * cv.height);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000;
    return { gray:g, w:cv.width, h:cv.height };
  }
  async function ocrLines(gray, w, h){
    await loadTesseract();
    const worker = await getWorker();
    progressHandler = m => { if (m.status === 'recognizing text') cMsg('Reading… ' + Math.round((m.progress || 0) * 100) + '%', 'warn'); };
    const words = await ocrWords(worker, gray, w, h, false);
    progressHandler = null;
    return wordsToLines(words);
  }
  async function fileToText(file){
    const name = file.name.toLowerCase();
    if (file.size > IMPORT_MAX_MB * 1048576) throw new Error('That file is bigger than ' + IMPORT_MAX_MB + ' MB.');
    if (/\.(csv|txt)$/.test(name) || file.type === 'text/csv' || file.type === 'text/plain'){
      const t = await file.text();
      return /\.txt$/.test(name) ? t : calRowsToText(calParseCsv(t));
    }
    if (/\.(xlsx|xls)$/.test(name)){
      cMsg('Loading spreadsheet reader…', 'warn');
      await calLoadScript(XLSX_URL, () => window.XLSX);
      const wb = window.XLSX.read(await file.arrayBuffer(), { type:'array' });
      let rows = [];
      wb.SheetNames.forEach(n => { rows = rows.concat(window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:false, dateNF:'yyyy-mm-dd', defval:'' })); });
      return calRowsToText(rows);
    }
    if (/\.pdf$/.test(name) || file.type === 'application/pdf'){
      cMsg('Loading PDF reader…', 'warn');
      await calLoadScript(PDFJS_URL, () => window.pdfjsLib);
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      const pdf = await window.pdfjsLib.getDocument({ data:await file.arrayBuffer() }).promise;
      let lines = [];
      for (let p = 1; p <= Math.min(pdf.numPages, 40); p++){
        const tc = await (await pdf.getPage(p)).getTextContent();
        lines = lines.concat(pdfItemsToLines(tc.items.filter(i => i.str && i.str.trim()).map(i => ({ text:i.str, x0:i.transform[4], x1:i.transform[4] + i.width, y:i.transform[5], h:Math.abs(i.transform[3]) || 10 }))));
      }
      if (lines.join('').length < 30){          // scanned PDF: read the pages as pictures
        lines = [];
        for (let p = 1; p <= Math.min(pdf.numPages, 6); p++){
          cMsg('Scanned PDF, reading page ' + p + '…', 'warn');
          const page = await pdf.getPage(p), vp = page.getViewport({ scale:2.2 });
          const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
          const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
          await page.render({ canvasContext:ctx, viewport:vp }).promise;
          const g = canvasGray(cv);
          lines = lines.concat(await ocrLines(g.gray, g.w, g.h));
        }
      }
      return lines.join('\n');
    }
    if (/^image\//.test(file.type) || /\.(png|jpe?g|webp|bmp)$/.test(name)){
      cMsg('Preparing image…', 'warn');
      const g = await prepareGray(file);
      return (await ocrLines(g.gray, g.w, g.h)).join('\n');
    }
    throw new Error('Please choose a PDF, Excel, CSV, text file or a photo.');
  }

      if (!r) return;
      if (f === 'include') r.include = t.checked;
      else { r[f] = t.value; r.ok = true; if (f === 'category' || f === 'scope') cRender(); }
      if (f === 'include') { const b = cBody.querySelector('[data-act="import-save"]'); if (b) b.textContent = 'Add ' + CS.rows.filter(x => x.include).length + ' selected'; }
    } else if (t.dataset.f && CS.draft){
      const f = t.dataset.f;
      CS.draft[f] = f === 'status' ? (t.checked ? 'confirmed' : 'pending') : t.value;
      if (f === 'category' || f === 'scope') cRender();
    } else if (t.dataset.set === 'calc'){ cal.calcDate = t.value; calSave(false); }
    else if (t.dataset.set === 'att'){ const v = Number(t.value); if (v >= 1 && v <= 100){ cal.attendancePct = v; calSave(true); } }
    else if (t.dataset.set === 'userwins'){ cal.userWins = t.checked; calSave(true); }
    else if (t.dataset.set === 'rule'){ const r = cal.rules.find(x => x.id === t.dataset.id); if (r){ r.enabled = t.checked; calSave(true); } }
    else if (t.dataset.alias){
      const k = t.dataset.alias, base = (cBaseSubjects().find(x => x[0] === k) || [k, ''])[1], v = t.value.trim();
      if (!v || v === base) delete cal.aliases[k]; else cal.aliases[k] = v.slice(0, 40);
      calSave(true);
    } else if (t.id === 'iFile' && t.files && t.files[0]){
      const file = t.files[0]; t.value = '';
      (async () => {
        try{ cMsg('Reading file…', 'warn'); cStartReview(await fileToText(file), file.name); }
        catch(err){ cMsg(err && err.message === 'NETWORK' ? 'Could not load the reader. Check your internet, or paste the text instead.' : (err && err.message) || 'Could not read that file. Try CSV, or paste the text.', 'err'); }
      })();
    }
  });
  cBody.addEventListener('click', async e => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, id = t.dataset.id;
    try{
      if (act === 'tab'){ CS.tab = t.dataset.t; cRender(); }
      else if (act === 'subject'){ CS.subject = t.dataset.name; CS.showAll = false; CS.view = 'subject'; cRender(); cBody.scrollTop = 0; }
      else if (act === 'toggle-all'){ CS.showAll = !CS.showAll; cRender(); }
      else if (act === 'goto-settings'){ CS.view = 'main'; CS.tab = 'settings'; cRender(); }
      else if (act === 'edit-tt'){ calOverlay.classList.remove('open'); openEditor(); }
      else if (act === 'save-sem'){
        const s = { name:document.getElementById('sName').value.trim(), start:document.getElementById('sStart').value, end:document.getElementById('sEnd').value };
        if (!calValidIso(s.start) || !calValidIso(s.end)){ cMsg('Please choose both dates.', 'err'); return; }
        if (s.end < s.start){ cMsg('The end date must be after the start date.', 'err'); return; }
        cal.semester = s; calSave(true); cRender(); cMsg('Saved.', 'ok');
      }
      else if (act === 'add-entry'){ CS.draft = { isNew:true, title:'', category:'holiday', start:'', end:'', scope:'full', from:'', to:'', useDay:'', origin:'official', status:'confirmed' }; CS.view = 'entry'; cRender(); }
      else if (act === 'edit-entry'){ const en = cal.entries.find(x => x.id === id); if (en){ CS.draft = Object.assign({ isNew:false, from:'', to:'' }, en); CS.view = 'entry'; cRender(); } }
      else if (act === 'save-entry'){
        const d = CS.draft, clean = cCleanEntry(d), err = cValidateEntry(clean);
        if (err){ cMsg(err, 'err'); return; }
        if (!clean.title) clean.title = CAT[clean.category];
        const i = cal.entries.findIndex(x => x.id === clean.id);
        if (i >= 0) cal.entries[i] = clean; else cal.entries.push(clean);
        calSave(true); CS.view = 'main'; CS.tab = 'calendar'; cRender(); cMsg('Saved.', 'ok');
      }
      else if (act === 'del-entry'){
        if (t.dataset.armed !== '1'){ t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; setTimeout(() => { t.dataset.armed = ''; t.textContent = 'Delete'; }, 3500); return; }
        cal.entries = cal.entries.filter(x => x.id !== CS.draft.id); calSave(true); CS.view = 'main'; CS.tab = 'calendar'; cRender();
      }
      else if (act === 'confirm-entry'){ const en = cal.entries.find(x => x.id === id); if (en){ en.status = 'confirmed'; calSave(true); cRender(); } }
      else if (act === 'confirm-all'){ cal.entries.forEach(x => { x.status = 'confirmed'; }); calSave(true); cRender(); }
      else if (act === 'import'){ CS.view = 'import'; cRender(); }
      else if (act === 'read-text'){
        const txt = document.getElementById('iText').value;
        if (!txt.trim()){ cMsg('Paste some text first.', 'err'); return; }
        cStartReview(txt, 'pasted text');
      }
      else if (act === 'import-save'){
        const chosen = CS.rows.filter(r => r.include);
        if (!chosen.length){ cMsg('Tick at least one row.', 'err'); return; }
        const made = [];
        for (const r of chosen){
          const en = cCleanEntry({ title:r.title, category:r.category, start:r.start, end:r.end, scope:r.scope, from:r.from, to:r.to, useDay:r.useDay, origin:'official', status:(r.uncertain && !r.ok) ? 'pending' : 'confirmed', source:CS.fileName });
          const err = cValidateEntry(en);
          if (err){ cMsg((r.title || r.start || 'A row') + ': ' + err, 'err'); return; }
          if (!en.title) en.title = CAT[en.category];
          made.push(en);
        }
        cal.entries = cal.entries.concat(made); calSave(true);
        CS.view = 'main'; CS.tab = 'calendar'; cRender(); cMsg(made.length + ' entr' + (made.length > 1 ? 'ies' : 'y') + ' added.', 'ok');
      }
      else if (act === 'missed-inc' || act === 'missed-dec'){
        const k = CS.subject; cal.missed[k] = Math.max(0, (cal.missed[k] || 0) + (act === 'missed-inc' ? 1 : -1)); calSave(false); cRender();
      }
      else if (act === 'preset-cal'){
        if (cal.entries.length && !cArm(t, 'Tap again to replace your calendar entries')) return;
        applyPresetCal(); cRender(); cMsg('JECRC Semester III calendar loaded. Open Summary to see your numbers.', 'ok');
      }
      else if (act === 'preset-tt'){
        if (CAL_DAYS.some(d => (weeklySchedule[d] || []).length) && !cArm(t, 'Tap again to replace your timetable')) return;
        weeklySchedule = JSON.parse(JSON.stringify(TT_PRESET_DB)); saveSchedule(); refreshToday(); render(); cRender(); cMsg('Section DB timetable loaded.', 'ok');
      }
      else if (act === 'calc-today'){ cal.calcDate = ''; calSave(false); cRender(); }
      else if (act === 'rule-add'){
        const ord = Number(document.getElementById('rOrd').value), day = document.getElementById('rDay').value;
        if (!cal.rules.some(r => r.ordinal === ord && r.weekday === day)){ cal.rules.push({ id:newId(), ordinal:ord, weekday:day, enabled:true }); calSave(true); }
        cRender();
      }
      else if (act === 'rule-del'){ cal.rules = cal.rules.filter(r => r.id !== id); calSave(true); cRender(); }
      else if (act === 'backup'){ document.getElementById('bText').value = JSON.stringify(cal); cMsg('Copy this text and keep it somewhere safe.', 'ok'); }
      else if (act === 'copy-backup'){
        const ta = document.getElementById('bText'); if (!ta.value) ta.value = JSON.stringify(cal);
        try{ await navigator.clipboard.writeText(ta.value); cMsg('Copied.', 'ok'); }catch(_){ ta.select(); cMsg('Select the text and copy it.', 'warn'); }
      }
      else if (act === 'restore'){
        let p; try{ p = JSON.parse(document.getElementById('bText').value); }catch(_){ cMsg('That text is not a valid backup.', 'err'); return; }
        if (!p || !p.semester || !Array.isArray(p.entries)){ cMsg('That text is not a BunkSafe calendar backup.', 'err'); return; }
        cal = Object.assign(calDefault(), p);
        calSave(true); cRender(); cMsg('Backup restored.', 'ok');
      }
      else if (act === 'reset'){
        if (t.dataset.armed !== '1'){ t.dataset.armed = '1'; t.textContent = 'Tap again to erase'; setTimeout(() => { t.dataset.armed = ''; t.textContent = 'Erase calendar data'; }, 3500); return; }
        cal = calDefault(); calSave(true); cRender();
      }
    }catch(err){ cMsg((err && err.message) || 'Something went wrong.', 'err'); }
  });

  editBtn.addEventListener('click', openEditor);
  editorClose.addEventListener('click', closeEditor);
  editorCancel.addEventListener('click', closeEditor);
  editorSave.addEventListener('click', () => {
    const nm = document.getElementById('nameInput').value.trim();
    userName = nm || 'Friend';
    hasSavedName = !!nm;
    try{ if (nm) window.localStorage.setItem(NAME_KEY, nm); else window.localStorage.removeItem(NAME_KEY); }catch(e){}
    // drop incomplete rows silently
    Object.keys(draftSchedule).forEach(day => {
      draftSchedule[day] = (draftSchedule[day] || []).filter(s => s.start && s.end && s.label && s.start < s.end);
    });
    weeklySchedule = draftSchedule;
    draftSchedule = null;
    saveSchedule();
    refreshToday();
    render();
    closeEditor();
  });

  /* ---------------- Master render (ticks every second) ---------------- */
  function render(){
    const now = new Date();
    const dk = now.toDateString();
    if (dk !== lastDateKey){ lastDateKey = dk; refreshToday(); }
    updateClock(now);
    dateRow.textContent = now.toLocaleDateString([], { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
    greetingEl.innerHTML = `${greetingWord()}, <span>${esc(userName)}</span>`;

    if (!themeManual) { theme = autoTheme(); applyTheme(); }

    const s = computeStatus(now);
    setAccent(s.accent);
    pulseDot.style.background = ACCENTS[s.accent].c;
    pulseDot.style.boxShadow = `0 0 0 3px ${ACCENTS[s.accent].s}`;
    statusPill.textContent = s.pill;
    statusLabel.textContent = s.label;
    statusMsg.innerHTML = s.msg;

    renderCta();
    updateTimeline(now);
  }

  prevDayBtn.addEventListener('click', () => changeDay(-1));
  nextDayBtn.addEventListener('click', () => changeDay(1));
  todayBtn.addEventListener('click', () => { const dir = viewOffset > 0 ? -1 : 1; viewOffset = 0; refreshView(dir); });

  /* Swipe: left = next day, right = previous day */
  (function(){
    const appEl = document.getElementById('app');
    let sx = 0, sy = 0, st = 0, tracking = false, zone = 'blank';
    appEl.addEventListener('touchstart', e => {
      if (editorOverlay.classList.contains('open') || calOverlay.classList.contains('open')) { tracking = false; return; }
      if (e.target.closest && e.target.closest('input, button')) { tracking = false; return; }
      zone = (e.target.closest && e.target.closest('.timeline, .day-nav, .panel-title')) ? 'days' : 'blank';
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; st = Date.now(); tracking = true;
    }, { passive:true });
    appEl.addEventListener('touchend', e => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Date.now() - st > 700) return;
      if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      if (zone === 'blank' && dx > 0) cOpen();            // swipe right on empty space: open the calendar
      else changeDay(dx < 0 ? 1 : -1);                    // swipe on the schedule list: change day
    }, { passive:true });
    document.addEventListener('keydown', e => {
      if (editorOverlay.classList.contains('open') || calOverlay.classList.contains('open')) return;
      if (e.key === 'ArrowLeft') changeDay(-1);
      if (e.key === 'ArrowRight') changeDay(1);
    });
  })();

  greetingEl.addEventListener('click', openEditor);
  loadSchedule().then(() => { if (!hasSavedName) openEditor(); });
  setInterval(render, 1000);
})();
</script>
<script>
if ('serviceWorker' in navigator){
  var hadController = !!navigator.serviceWorker.controller;
  function showUpdateBar(){
    if (document.getElementById('updateBar')) return;
    var bar = document.createElement('div');
    bar.id = 'updateBar';
    bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:200;background:#171B21;color:#EDEFF1;border:1px solid #3F9468;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font:600 13.5px Manrope,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45)';
    bar.innerHTML = '<span style="flex:1">A new version of BunkSafe is ready.</span><button id="updateBtn" style="border:none;border-radius:10px;background:#3F9468;color:#fff;font:700 13px Manrope,system-ui,sans-serif;padding:9px 14px">Reload</button>';
    document.body.appendChild(bar);
    document.getElementById('updateBtn').onclick = function(){ location.reload(); };
  }
  navigator.serviceWorker.addEventListener('message', function(e){ if (e.data && e.data.type === 'bunksafe-updated') showUpdateBar(); });
  navigator.serviceWorker.addEventListener('controllerchange', function(){ if (hadController) showUpdateBar(); });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){ reg.update().catch(function(){}); }).catch(function(){});
  });
}
</script>
